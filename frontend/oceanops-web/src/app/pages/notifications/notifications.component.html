<div class="notifications-container">
  <h2>Notifications</h2>

  <div *ngFor="let n of notifications" class="notif-item" [class.read]="n.read">
    <p>{{ n.message }}</p>
    <small>{{ n.createdAt | date : 'short' }}</small>

    <button *ngIf="!n.read" (click)="markAsRead(n.id)">Mark as read</button>
  </div>

  <p *ngIf="notifications.length === 0">No notifications.</p>
</div>
